<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify full installers for desktop</title>
  <meta name="description" content="Download Spotify full installers for Windows, macOS, and Linux">
  <meta name="google-site-verification" content="dZPtbcIZb0eyy8HzugWp_5DwcDgyBkfU0AdN6wEicMs" />
  <link type="image/png" rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://loadspot.amd64fox1.workers.dev" crossorigin>
  <link rel="preconnect" href="https://loadspot.amd64fox1.workers.dev">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <nav class="nav-container">
    <div class="navbar">
      <div class="nav-brand"></div>
      <ul class="nav-center">
        <li><a href="/versions" data-page="versions" class="active">Versions</a></li>
        <li><a href="/faq" data-page="faq">FAQ</a></li>
      </ul>
    </div>
  </nav>

  <header>
    <h1>Spotify full installers for desktop</h1>
  </header>

  <div id="markdownContainer" class="is-initially-hidden"></div>

  <div class="container is-initially-hidden" id="tableContainer">
    <div class="versions-toolbar">
      <div class="filter-panel hidden">
        <div id="arch-filters" class="arch-filter-buttons"></div>
      </div>
      <div class="filter-buttons">
        <button class="filter-button active" data-os="win">
          <span class="os-icon win-icon">
            <svg data-icon="windows"></svg>
          </span>
          Windows
        </button>
        <button class="filter-button" data-os="mac">
          <span class="os-icon mac-icon">
            <svg data-icon="macos"></svg>
          </span>
          Mac
        </button>
        <button class="filter-button" data-os="linux">
          <span class="os-icon linux-icon">
            <svg data-icon="linux"></svg>
          </span>
          Linux
        </button>
        <div class="search-container" id="searchContainer">
          <span class="search-icon" id="searchIcon">
            <svg data-icon="search"></svg>
          </span>
          <input type="search" id="versionSearch" placeholder="Search by version">
          <span class="clear-search"></span>
        </div>
      </div>
    </div>
    <div class="table-scroll">
      <table class="version-table" id="versionsTable">
        <colgroup>
          <col class="col-version">
          <col class="col-architecture">
          <col class="col-date">
          <col class="col-size">
          <col class="col-action">
        </colgroup>
        <thead>
          <tr class="table-headers">
            <th>
              <div id="versionHeader" class="version-header" aria-label="Version column">
                <span id="versionSortControl" class="version-sort-control" role="button" tabindex="0" aria-label="Sort by version">
                  <span class="version-label">Version</span>
                  <span id="sortArrow" class="sort-arrow">
                    <svg data-icon="chevron-down"></svg>
                  </span>
                </span>
              </div>
            </th>
            <th>Architecture</th>
            <th>Date</th>
            <th>
              <div id="sizeHeader" class="size-header" aria-label="Size column">
                <span id="sizeSortControl" class="size-sort-control" role="button" tabindex="0" aria-label="Sort by size">
                  <span class="size-label">Size</span>
                  <span id="sizeSortArrow" class="sort-arrow">
                    <svg data-icon="chevron-down"></svg>
                  </span>
                </span>
                <div id="sizeLoadingIndicator" class="size-loading-indicator">
                  <div class="loading-spinner"></div>
                  <span class="loading-text">Loading sizes...</span>
                </div>
              </div>
            </th>
            <th> </th>
          </tr>
        </thead>
        <tbody id="versions-container">
        </tbody>
      </table>
    </div>
  </div>
  <div class="toast-notification" id="toast">Copied to clipboard</div>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/snow.js"></script>
  <template id="download-icon-template">
    <svg data-icon="download"></svg>
  </template>
  <template id="copy-link-icon-template">
    <svg data-icon="copy-link"></svg>
  </template>
  <template id="comment-icon-template">
    <svg data-icon="comment"></svg>
  </template>

  <template id="comments-modal-template">
    <div class="comments-modal" role="dialog" aria-modal="true" aria-labelledby="comments-modal-title">
      <div class="comments-modal-content">
        <div class="comments-modal-header">
          <h3 class="comments-modal-title" id="comments-modal-title">Comments for <span id="comment-version-title"></span></h3>
          <button class="comments-close-button" aria-label="Close comments">&times;</button>
        </div>
        <div class="comments-modal-body" id="comments-container" role="main">
        </div>
      </div>
    </div>
  </template>
</body>

</html>
